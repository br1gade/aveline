services:
  postgres:
    image: postgres:16-alpine
    container_name: aveline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aveline
      POSTGRES_PASSWORD: aveline
      POSTGRES_DB: aveline
    ports:
      - '5433:5432'
    volumes:
      - aveline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aveline -d aveline']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aveline-pgdata:
