services:
  postgres:
    image: postgres:16-alpine
    container_name: aveline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aveline
      POSTGRES_PASSWORD: aveline
      POSTGRES_DB: aveline
    ports:
      - '5433:5432'
    volumes:
      - aveline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aveline -d aveline']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aveline-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: aveline-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: aveline
      MONGO_INITDB_ROOT_PASSWORD: aveline
      MONGO_INITDB_DATABASE: aveline
    ports:
      - '27018:27017'
    volumes:
      - aveline-mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: aveline-garage
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - aveline-garage-meta:/var/lib/garage/meta
      - aveline-garage-data:/var/lib/garage/data

  # A real SMTP server that never forwards anything, so the mail path is
  # exercised end to end in development without credentials and without any
  # risk of writing to a stranger's inbox. The web UI is the dev inbox.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: aveline-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aveline-pgdata:
  aveline-mongodata:
  aveline-garage-meta:
  aveline-garage-data:
