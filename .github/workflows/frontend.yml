name: Frontend checks
# Runs on every push and pull request that touches the client or the contract it is typed from, by
# hand from the Actions tab, and from another workflow (`workflow_call`), so a release can wait for
# it (proposed to the backend: frontend/docs/BACKEND_REQUESTS.md §4). Enabled on 22 November 2026,
# audit A4-01. The end-to-end suite (frontend/test/e2e) is not run here: it needs the backend's
# development stack, and runs against it by hand until staging exists. See
# frontend/docs/ARCHITECTURE.md §12 (CI).
on:
  push:
    paths: ['frontend/**', 'backend/openapi.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/openapi.json', '.github/workflows/frontend.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # The boundary check compares with origin/dev.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Types from ../backend/openapi.json, tokens, formatting, types, lint, unit tests, build, budgets.
      - run: npm run verify
      # Only a frontend branch's pull request must keep inside frontend/: a backend one that changes
      # openapi.json runs these checks too, and legitimately changes backend files.
      - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'frontend/')
        run: npm run check:boundaries
